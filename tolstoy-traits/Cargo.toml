[package]
edition = "2021"
name = "tolstoy_traits"
version = "0.0.2"
workspace = ".."

[lib]
name = "tolstoy_traits"
path = "lib.rs"

[features]
sqlcipher = ["rusqlite/sqlcipher"]

[dependencies]
failure = "~0.1"
failure_derive = "~0.1"
http = "~1.4"
hyper = "~1.8"
serde_json = "~1.0"
uuid = { version = "~1.19" }

[dependencies.rusqlite]
version = "~0.38"
features = ["limits", "bundled"]

[dependencies.db_traits]
path = "../db-traits"
